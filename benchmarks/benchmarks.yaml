defaults:
  output_root: benchmark_results
  executable: build/main
  mpirun: mpirun
  mesh_catalog:
    L0: ../mesh/navierstokes_L0.msh
    L1: ../mesh/navierstokes_L1.msh
    3D_L0: ../mesh/navierstokes3D_L0.msh
    3D_L1: ../mesh/navierstokes3D_L1.msh
  reynolds_viscosity:
    20: 0.005
    100: 0.001
    200: 0.0005
  base_config:
    dimension: 2
    mesh: L0
    velocity_degree: 2
    pressure_degree: 1
    theta: 0.6
    dt: 0.001
    final_time: 8.0
    statistics_start_time: 0.0
    inlet_velocity: 1.5
    inlet_ramp_time: 8.0
    inlet_channel_height: 0.41
    inlet_channel_width: 0.41
    reference_velocity: 1.0
    reference_length: 0.1
    reference_span: 0.41
    Re: 100
    nu: 0.001
    nonlinear_method: oseen
    nonlinear_iterations: 2
    nonlinear_tolerance: 1e-6
    picard_relaxation: 1.0
    preconditioner: pcd
    simple_pressure_relaxation: 0.3
    temam: true
    grad_div: true
    gamma_grad_div: 0.01
    supg: true
    linear_relative_tolerance: 1e-6
    linear_absolute_tolerance: 1e-10
    gmres_restart_length: 300
    linear_max_iterations: 10000
    pressure_regularization: 0.0
    outlet_pressure: 0.0
    boundary_ids:
      inlet: 1
      outlet: 2
      walls: 3
      cylinder: 5
    supg: true
    linear_relative_tolerance: 1e-6
    block_triangular_velocity_max_iterations: 15
    block_triangular_schur_max_iterations: 15
    block_triangular_velocity_relative_tolerance: 5e-1
    block_triangular_schur_relative_tolerance: 5e-1
    simple_velocity_max_iterations: 10
    simple_schur_max_iterations: 10
    simple_velocity_relative_tolerance: 5e-1
    simple_schur_relative_tolerance: 5e-1
    pcd_velocity_max_iterations: 30
    pcd_pressure_max_iterations: 30
    pcd_velocity_relative_tolerance: 5e-1
    pcd_pressure_relative_tolerance: 5e-1
    yosida_velocity_max_iterations: 10000
    yosida_schur_max_iterations: 10000
    yosida_correction_max_iterations: 10000
    yosida_relative_tolerance: 5e-1
    preconditioner_absolute_tolerance: 1e-12
    yosida_absolute_tolerance: 1e-14
    mpi_ranks: 4
    write_solution_output: false

benchmarks:
  V0:
    previous_id: B0
    description: Sanity run.
    config:
      final_time: 1.0
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd

  V1:
    previous_id: B1
    description: 2D-1 steady validation.
    config:
      final_time: 10.0
      dt: 0.001
      inlet_velocity: 0.3
      inlet_ramp_time: 0.0
      reference_velocity: 0.2
      Re: 20
      nu: 0.001
      preconditioner: pcd

  V2:
    previous_id: B3
    description: 2D-2 periodic validation.
    config:
      final_time: 20.0
      statistics_start_time: 10.0
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd

  V3:
    previous_id: B2
    description: 2D-3 ramp validation.
    config:
      final_time: 8.0
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 8.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd

  V4:
    previous_id: B4
    description: Mesh refinement on 2D-3.
    config:
      final_time: 8.0
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 8.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd
    sweep:
      mesh: [L0, L1]

  V5:
    previous_id: B5
    description: Timestep refinement on 2D-3.
    config:
      final_time: 8.0
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 8.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd
    sweep:
      dt: [0.01, 0.005, 0.0025, 0.001, 0.0005] #aggiunto 0.0005

  V6:
    previous_id: B6
    description: Reynolds sweep on 2D-3.
    config:
      final_time: 8.0
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 8.0
      reference_velocity: 1.0
      preconditioner: pcd
    sweep:
      Re:
        - {Re: 20, nu: 0.005}
        - {Re: 100, nu: 0.001}
        - {Re: 200, nu: 0.0005}

  V7:
    previous_id: B9
    description: Grad-div sweep on 2D-3.
    config:
      final_time: 8.0
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 8.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      preconditioner: pcd
      grad_div: true
    sweep:
      stabilization:
        - {name: gamma_0, temam: true, grad_div: true, gamma_grad_div: 0.0, supg: true}
        - {name: gamma_1e_3, temam: true, grad_div: true, gamma_grad_div: 0.001, supg: true}
        - {name: gamma_1e_2, temam: true, grad_div: true, gamma_grad_div: 0.01, supg: true}
        - {name: gamma_5e_2, temam: true, grad_div: true, gamma_grad_div: 0.05, supg: true}
        #- {name: gamma_1e_1, temam: true, grad_div: true, gamma_grad_div: 0.1, supg: true} --troppo peso--

  V8:
    previous_id: B7
    description: Optional 3D validation.
    config:
      dimension: 3
      mesh: 3D_L1
      final_time: 8.0
      dt: 0.001
      inlet_velocity: 2.25
      inlet_ramp_time: 8.0
      inlet_channel_height: 0.41
      inlet_channel_width: 0.41
      reference_velocity: 1.0
      reference_length: 0.1
      reference_span: 0.41
      Re: 100
      nu: 0.001
      preconditioner: pcd
      mpi_ranks: 8

  V9:
    description: Reynolds, inlet-velocity, and inlet-ramp sweep on the 2D setup.
    config:
      final_time: 8.0
      statistics_start_time: 0.0
      dt: 0.005
      mesh: L0
      nonlinear_method: oseen
      nonlinear_iterations: 2
      preconditioner: pcd
      write_solution_output: true
    sweep:
      config_profile:
        # ramp_time = 0 gives a constant inlet.  ramp_time = 8 gives the
        # Schaefer--Turek half-sine pulse over the full [0,8] interval.
        - {name: uin0p75_const_Re20, inlet_velocity: 0.75, inlet_ramp_time: 0.0, reference_velocity: 0.5, Re: 20, nu: 0.0025}
        - {name: uin0p75_const_Re100, inlet_velocity: 0.75, inlet_ramp_time: 0.0, reference_velocity: 0.5, Re: 100, nu: 0.0005}
        - {name: uin0p75_const_Re200, inlet_velocity: 0.75, inlet_ramp_time: 0.0, reference_velocity: 0.5, Re: 200, nu: 0.00025}
        - {name: uin0p75_ramp8_Re20, inlet_velocity: 0.75, inlet_ramp_time: 8.0, reference_velocity: 0.5, Re: 20, nu: 0.0025}
        - {name: uin0p75_ramp8_Re100, inlet_velocity: 0.75, inlet_ramp_time: 8.0, reference_velocity: 0.5, Re: 100, nu: 0.0005}
        - {name: uin0p75_ramp8_Re200, inlet_velocity: 0.75, inlet_ramp_time: 8.0, reference_velocity: 0.5, Re: 200, nu: 0.00025}
        - {name: uin1p5_const_Re20, inlet_velocity: 1.5, inlet_ramp_time: 0.0, reference_velocity: 1.0, Re: 20, nu: 0.005}
        - {name: uin1p5_const_Re100, inlet_velocity: 1.5, inlet_ramp_time: 0.0, reference_velocity: 1.0, Re: 100, nu: 0.001}
        - {name: uin1p5_const_Re200, inlet_velocity: 1.5, inlet_ramp_time: 0.0, reference_velocity: 1.0, Re: 200, nu: 0.0005}
        - {name: uin1p5_ramp8_Re20, inlet_velocity: 1.5, inlet_ramp_time: 8.0, reference_velocity: 1.0, Re: 20, nu: 0.005}
        - {name: uin1p5_ramp8_Re100, inlet_velocity: 1.5, inlet_ramp_time: 8.0, reference_velocity: 1.0, Re: 100, nu: 0.001}
        - {name: uin1p5_ramp8_Re200, inlet_velocity: 1.5, inlet_ramp_time: 8.0, reference_velocity: 1.0, Re: 200, nu: 0.0005}
        - {name: uin2p25_const_Re20, inlet_velocity: 2.25, inlet_ramp_time: 0.0, reference_velocity: 1.5, Re: 20, nu: 0.0075}
        - {name: uin2p25_const_Re100, inlet_velocity: 2.25, inlet_ramp_time: 0.0, reference_velocity: 1.5, Re: 100, nu: 0.0015}
        - {name: uin2p25_const_Re200, inlet_velocity: 2.25, inlet_ramp_time: 0.0, reference_velocity: 1.5, Re: 200, nu: 0.00075}
        - {name: uin2p25_ramp8_Re20, inlet_velocity: 2.25, inlet_ramp_time: 8.0, reference_velocity: 1.5, Re: 20, nu: 0.0075}
        - {name: uin2p25_ramp8_Re100, inlet_velocity: 2.25, inlet_ramp_time: 8.0, reference_velocity: 1.5, Re: 100, nu: 0.0015}
        - {name: uin2p25_ramp8_Re200, inlet_velocity: 2.25, inlet_ramp_time: 8.0, reference_velocity: 1.5, Re: 200, nu: 0.00075}

  P0:
    aliases: [T_MAXITER]
  P1:
    previous_id: P1
    description: Baseline preconditioner comparison.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]

  P2:
    previous_id: P2
    description: Timestep sensitivity.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]
      dt: [0.01, 0.005, 0.0025, 0.001, 0.0005] #aggiunto 0.0005

  P3:
    previous_id: P3
    description: Mesh sensitivity / optimality.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
      mpi_ranks: 4
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]
      mesh: [L0, L1]

  P4:
    previous_id: P4
    description: Reynolds / viscosity sensitivity.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]
      Re:
        - {Re: 20, nu: 0.005}
        - {Re: 100, nu: 0.001}
        - {Re: 200, nu: 0.0005}

  P5:
    previous_id: P5
    description: SIMPLE relaxation sweep.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: simple
      write_solution_output: false
    sweep:
      simple_pressure_relaxation: [0.2, 0.3, 0.5, 0.7, 0.9, 1.0]

  P6:
    previous_id: P6
    description: PCD inner tolerance sweep.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: pcd
      write_solution_output: false
    sweep:
      pcd_pressure_relative_tolerance: [1e-1, 1e-2, 1e-3, 1e-4]

  P7:
    previous_id: P10
    description: Cost breakdown.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]

  P8:
    previous_id: P9
    description: MPI strong scaling.
    config:
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.001
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
    sweep:
      preconditioner: [simple, pcd, yosida, block_triangular]
      mpi_ranks: [1, 2, 4, 8]

  P9:
    previous_id: P11
    description: Optional 3D preconditioner test.
    config:
      dimension: 3
      mesh: 3D_L0
      final_time: 1.5
      statistics_start_time: 0.5
      dt: 0.005
      inlet_velocity: 2.25
      inlet_ramp_time: 8.0
      inlet_channel_height: 0.41
      inlet_channel_width: 0.41
      reference_velocity: 1.0
      reference_length: 0.1
      reference_span: 0.41
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      write_solution_output: false
      mpi_ranks: 8
    sweep:
      preconditioner: [simple, pcd, block_triangular]

  T_SIMPLE_MAXITER:
    description: Tuning SIMPLE con cap bassi sulle iterazioni interne.
    config:
      final_time: 1.0
      statistics_start_time: 0.5
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: simple
      simple_pressure_relaxation: 0.3
      simple_velocity_relative_tolerance: 5e-1
      simple_schur_relative_tolerance: 5e-1
      write_solution_output: false
    sweep:
      config_profile:
        - {name: mi5, simple_velocity_max_iterations: 5, simple_schur_max_iterations: 5}
        - {name: mi10, simple_velocity_max_iterations: 10, simple_schur_max_iterations: 10}
        - {name: mi15, simple_velocity_max_iterations: 15, simple_schur_max_iterations: 15}
        - {name: mi20, simple_velocity_max_iterations: 20, simple_schur_max_iterations: 20}
        - {name: mi30, simple_velocity_max_iterations: 30, simple_schur_max_iterations: 30}
        - {name: mi50, simple_velocity_max_iterations: 50, simple_schur_max_iterations: 50}

  T_BLOCK_MAXITER:
    description: Tuning block triangular con cap bassi sulle iterazioni interne.
    config:
      final_time: 1.0
      statistics_start_time: 0.5
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: block_triangular
      block_triangular_velocity_relative_tolerance: 5e-1
      block_triangular_schur_relative_tolerance: 5e-1
      write_solution_output: false
    sweep:
      config_profile:
        - {name: mi5, block_triangular_velocity_max_iterations: 5, block_triangular_schur_max_iterations: 5}
        - {name: mi10, block_triangular_velocity_max_iterations: 10, block_triangular_schur_max_iterations: 10}
        - {name: mi15, block_triangular_velocity_max_iterations: 15, block_triangular_schur_max_iterations: 15}
        - {name: mi20, block_triangular_velocity_max_iterations: 20, block_triangular_schur_max_iterations: 20}
        - {name: mi30, block_triangular_velocity_max_iterations: 30, block_triangular_schur_max_iterations: 30}
        - {name: mi50, block_triangular_velocity_max_iterations: 50, block_triangular_schur_max_iterations: 50}

  T_PCD_MAXITER:
    description: Tuning PCD con cap bassi sulle iterazioni interne.
    config:
      final_time: 1.0
      statistics_start_time: 0.5
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: pcd
      pcd_velocity_relative_tolerance: 5e-1
      pcd_pressure_relative_tolerance: 5e-1
      write_solution_output: false
    sweep:
      config_profile:
        - {name: mi5, pcd_velocity_max_iterations: 5, pcd_pressure_max_iterations: 5}
        - {name: mi10, pcd_velocity_max_iterations: 10, pcd_pressure_max_iterations: 10}
        - {name: mi15, pcd_velocity_max_iterations: 15, pcd_pressure_max_iterations: 15}
        - {name: mi20, pcd_velocity_max_iterations: 20, pcd_pressure_max_iterations: 20}
        - {name: mi30, pcd_velocity_max_iterations: 30, pcd_pressure_max_iterations: 30}
        - {name: mi50, pcd_velocity_max_iterations: 50, pcd_pressure_max_iterations: 50}

  T_YOSIDA_MAXITER:
    description: Tuning Yosida con cap bassi sulle iterazioni interne.
    config:
      final_time: 1.0
      statistics_start_time: 0.5
      dt: 0.001
      mesh: L0
      inlet_velocity: 1.5
      inlet_ramp_time: 0.0
      reference_velocity: 1.0
      Re: 100
      nu: 0.001
      nonlinear_method: oseen
      nonlinear_iterations: 1
      preconditioner: yosida
      yosida_relative_tolerance: 5e-1
      write_solution_output: false
    sweep:
      config_profile:
        - {name: mi5, yosida_velocity_max_iterations: 5, yosida_schur_max_iterations: 5, yosida_correction_max_iterations: 5}
        - {name: mi10, yosida_velocity_max_iterations: 10, yosida_schur_max_iterations: 10, yosida_correction_max_iterations: 10}
        - {name: mi15, yosida_velocity_max_iterations: 15, yosida_schur_max_iterations: 15, yosida_correction_max_iterations: 15}
        - {name: mi20, yosida_velocity_max_iterations: 20, yosida_schur_max_iterations: 20, yosida_correction_max_iterations: 20}
        - {name: mi30, yosida_velocity_max_iterations: 30, yosida_schur_max_iterations: 30, yosida_correction_max_iterations: 30}
        - {name: mi50, yosida_velocity_max_iterations: 50, yosida_schur_max_iterations: 50, yosida_correction_max_iterations: 50}

  T_MAXITER:
    description: Gruppo tuning max_iter interni.
    aliases: [T_SIMPLE_MAXITER, T_BLOCK_MAXITER, T_PCD_MAXITER, T_YOSIDA_MAXITER]
